# Copy to secrets.yaml (git-ignored) or add these keys to Home Assistant's ESPHome secrets.yaml.

# LTE: APN of the SIM's operator (e.g. "internet.telekom", "web.vodafone.de", "internet" for congstar)
lte_apn: "internet"

# Your MQTT broker (Home Assistant picks the entities up via MQTT discovery)
mqtt_broker: "mqtt.example.org"
mqtt_port: 1883
mqtt_username: "obd-v2x-dongle"
mqtt_password: "change-me"

# OpenTrafficMap node ID: the friendly name OpenTrafficMap assigns (e.g. "node789"),
# see https://wiki.opentrafficmap.org/node-registration
otm_node_id: "node000"

# Traccar: OsmAnd protocol endpoint (default port 5055) and the device identifier set up in Traccar
traccar_url: "http://traccar.example.org:5055"
traccar_device_id: "obd-v2x-dongle"

# WireGuard tunnel to the home network (Home Assistant WireGuard add-on, or a router such as a Fritz!Box).
# Create a peer for the dongle there and copy its values. The MQTT broker and Traccar above can then be home
# addresses (e.g. 192.168.178.10), reached through the tunnel.
wireguard_address: "10.6.0.5"                       # the dongle's address in the tunnel
wireguard_private_key: "<the dongle peer's private key>"
wireguard_endpoint: "home.example.org"              # public name/IP of your home connection
wireguard_port: 51820
wireguard_peer_public_key: "<the server's public key>"
wireguard_home_network: "192.168.178.0/24"          # your home network (routed through the tunnel)
wireguard_tunnel_network: "10.6.0.0/24"             # the tunnel network

# Native API (ESPHome Builder logs) and default OTA ("Install -> Wirelessly"), both encrypted with this key:
# 32 random bytes, base64 (the ESPHome docs page for api generates one)
api_encryption_key: "<base64 key>"

# Firmware updates the dongle fetches itself: manifest.json from firmware/tools/make_release.py. Through the
# tunnel this can be Home Assistant's config/www/<dir>/ at its home address (nothing exposed to the internet):
ota_manifest_url: "http://192.168.178.10:8123/local/obd-v2x-dongle/manifest.json"
