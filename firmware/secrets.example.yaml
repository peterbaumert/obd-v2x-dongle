# Copy to secrets.yaml (git-ignored) or add these keys to Home Assistant's ESPHome secrets.yaml.

# LTE: APN of the SIM's operator (e.g. "internet.telekom", "web.vodafone.de", "internet" for congstar)
lte_apn: "internet"

# Your MQTT broker (Home Assistant picks the entities up via MQTT discovery)
mqtt_broker: "mqtt.example.org"
mqtt_port: 1883
mqtt_username: "obd-v2x-dongle"
mqtt_password: "change-me"

# OpenTrafficMap node ID: the friendly name OpenTrafficMap assigns (e.g. "node789"),
# see https://wiki.opentrafficmap.org/node-registration
otm_node_id: "node000"

# Traccar: OsmAnd protocol endpoint (default port 5055) and the device identifier set up in Traccar
traccar_url: "http://traccar.example.org:5055"
traccar_device_id: "obd-v2x-dongle"

# Firmware updates over LTE: manifest.json written by firmware/tools/make_release.py, on a web server the dongle
# can reach (https). The firmware contains these secrets: use a hard-to-guess path, e.g. Home Assistant's
# config/www/<random name>/ -> https://<your HA>/local/<random name>/manifest.json
ota_manifest_url: "https://homeassistant.example.org/local/0123456789abcdef/manifest.json"
