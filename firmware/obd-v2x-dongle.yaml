# OBD-II / V2X dongle firmware (ESPHome, ESP32-C5-WROOM-1U-N16R8 on the obd-v2x-dongle board).
#
# Uplink: LTE (Quectel EC200U-EU) via ESPHome's modem component (PPP + CMUX, ESPHome >= 2026.11).
# The ESP32-C5's Wi-Fi radio is the ITS-G5 / 802.11p receiver, so there is no Wi-Fi.
#   - Owner's MQTT broker (Home Assistant MQTT discovery): car battery, OBD-II live data, LTE, V2X counters
#   - OpenTrafficMap MQTT server: received ITS-G5 frames (components/otm_uplink)
#   - Traccar server: GPS position (OsmAnd protocol over HTTP)
# OBD-II requests are only sent while the engine runs (charging voltage): on cars like the Mercedes W205
# the gateway sleeps with the ignition off, and requests would wake the bus and drain the battery.
#
# Pin map: hardware/tools/gen_schematic.py, sheet "MCU" (module pin -> GPIO in the comments).

substitutions:
  name: obd-v2x-dongle
  friendly_name: OBD V2X Dongle
  traccar_url: !secret traccar_url              # e.g. http://traccar.example.org:5055 (OsmAnd port)
  traccar_device_id: !secret traccar_device_id  # device identifier configured in Traccar

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.11.0
  project:
    name: obd-v2x-dongle.firmware
    version: "0.4.0"
  on_boot:
    - priority: 800    # safe state before anything else runs
      then:
        - output.turn_off: kline_slp_n     # K-line transceiver asleep (not used yet)
  # The modem is powered by power_manager (on_network) only when a wake needs the network

esp32:
  variant: esp32c5
  board: esp32-c5-devkitc-1
  flash_size: 16MB
  framework:
    type: esp-idf

logger:
  hardware_uart: USB_SERIAL_JTAG

external_components:
  - source: github://hn/esphome-its-g5
    components: [its_g5_receiver]
  - source:
      type: local
      path: components
    components: [otm_uplink, obd2, ec200u_gnss, power_manager]

# ---------------------------------------------------------------- board control
output:
  - platform: gpio            # IO8 (pin 10): Q103 -> Q102 modem supply switch, high = modem powered
    id: lte_power_en
    pin: GPIO8
  - platform: gpio            # IO2 (pin 4): Q401 open collector, high = modem PWRKEY pulled low
    id: lte_pwrkey
    pin: GPIO2
  - platform: gpio            # IO3 (pin 5): Q402 open collector, high = modem RESET_N pulled low
    id: lte_reset
    pin: GPIO3
  - platform: gpio            # IO12 (pin 24): U404 FSA2567, low = nano-SIM J401, high = eSIM U403
    id: sim_sel
    pin: GPIO12
  - platform: gpio            # IO7 (pin 9): TJA1021 SLP_N, low = sleep
    id: kline_slp_n
    pin: GPIO7

binary_sensor:
  - platform: gpio            # IO9 (pin 11): modem STATUS via TXS0108E, high = modem running
    id: lte_status
    name: "LTE modem running"
    entity_category: diagnostic
    pin: GPIO9
  - platform: template
    id: engine_running
    name: "Engine running"
    device_class: running
    lambda: |-
      float v = id(car_battery).state;
      return !std::isnan(v) && v > id(set_engine_on_voltage).state;
    filters:
      - delayed_on: 5s
      - delayed_off: 30s
    on_press:
      - lambda: id(obd).set_active(true);
    on_release:
      - lambda: id(obd).set_active(false);
  - platform: template
    name: "Car battery low"
    device_class: battery
    lambda: |-
      float v = id(car_battery).state;
      return !std::isnan(v) && !id(engine_running).state && v < id(set_low_battery_voltage).state
             && v >= id(set_unplugged_voltage).state;
  - platform: template
    name: "Unplugged"
    icon: mdi:power-plug-off
    lambda: |-
      float v = id(car_battery).state;
      return !std::isnan(v) && v < id(set_unplugged_voltage).state;

# ---------------------------------------------------------------- LTE modem (EC200U-EU)
script:
  - id: lte_power_on
    mode: single
    then:
      - output.turn_on: lte_power_en
      - delay: 500ms
      - if:
          condition:
            binary_sensor.is_off: lte_status
          then:
            - output.turn_on: lte_pwrkey     # EC200U: PWRKEY low >= 2 s to power on
            - delay: 2500ms
            - output.turn_off: lte_pwrkey
      - wait_until:
          condition:
            binary_sensor.is_on: lte_status
          timeout: 20s
      - if:
          condition:
            binary_sensor.is_on: lte_status
          then:
            - modem.enable:
          else:
            - logger.log:
                level: ERROR
                format: "EC200U did not report STATUS high after PWRKEY"
  - id: lte_power_off
    mode: single
    then:
      - if:
          condition:
            modem.connected: lte
          then:
            - modem.send_at: "AT+QPOWD=1"     # orderly shutdown (detaches from the network)
            - wait_until:
                condition:
                  binary_sensor.is_off: lte_status
                timeout: 10s
      - modem.disable:
      - output.turn_off: lte_power_en         # cut the modem supply (Q102)

modem:
  id: lte
  model: GENERIC
  tx_pin: GPIO23              # IO23 (pin 21) MCU_TX_LTE -> modem RXD
  rx_pin: GPIO24              # IO24 (pin 23) MCU_RX_LTE <- modem TXD
  rts_pin: GPIO26             # IO26 (pin 27) MCU_RTS_LTE -> modem RTS
  cts_pin: GPIO25             # IO25 (pin 26) MCU_CTS_LTE <- modem CTS
  baud_rate: 115200
  apn: !secret lte_apn
  enable_on_boot: false       # lte_power_on enables it once the modem is up

switch:
  - platform: template
    id: stay_awake
    name: "Stay awake"
    icon: mdi:sleep-off
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    command_retain: true
  - platform: template
    id: auto_update
    name: "Install updates automatically"
    icon: mdi:update
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    command_retain: true
  - platform: template
    name: "Use eSIM"
    icon: mdi:sim
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    # Only switch SIMs while the modem's SIM interface is idle: drop the connection first
    turn_on_action:
      - modem.disable:
      - delay: 2s
      - output.turn_on: sim_sel
      - delay: 1s
      - modem.enable:
    turn_off_action:
      - modem.disable:
      - delay: 2s
      - output.turn_off: sim_sel
      - delay: 1s
      - modem.enable:

mqtt:
  id: mqtt_client
  broker: !secret mqtt_broker
  port: !secret mqtt_port
  username: !secret mqtt_username
  password: !secret mqtt_password
  discovery: true
  topic_prefix: ${name}
  # The dongle sleeps most of the time when parked: no birth/will/shutdown messages, so Home Assistant keeps
  # showing the last (retained) values instead of "unavailable"
  birth_message:
  will_message:
  shutdown_message:
  on_connect:
    # Home Assistant device tracker (map) for the GPS position, attached to this device
    - mqtt.publish:
        topic: homeassistant/device_tracker/${name}/config
        retain: true
        payload: !lambda |-
          return std::string("{\"name\":\"Position\",\"unique_id\":\"${name}_position\",") +
                 "\"json_attributes_topic\":\"${name}/position\",\"source_type\":\"gps\"," +
                 "\"device\":{\"ids\":\"" + get_mac_address() + "\"}}";
    - update.check: fw_update   # look for new firmware whenever the network comes up

# ---------------------------------------------------------------- firmware updates over LTE
# The dongle is behind the mobile network's NAT, so nothing can connect to it: it fetches new firmware itself.
# Release: compile, then `python firmware/tools/make_release.py <name>.ota.bin <dir>` and put the two files on a
# web server the dongle can reach (e.g. Home Assistant's config/www/<random name>/ -> https://<ha>/local/<random name>/).
# The binary contains the secrets (MQTT password, ...): use a hard-to-guess directory name, never a public place.
# Home Assistant shows a "Firmware" update entity; Install only reaches the dongle while it is awake (driving,
# "Stay awake"), so for a parked car turn on "Install updates automatically" and it installs at the next wake.
# safe_mode + OTA rollback: firmware that crashes within 2 min after an update is rolled back by the bootloader.
safe_mode:
  boot_is_good_after: 2min

ota:
  - platform: http_request
    id: ota_lte

update:
  - platform: http_request
    id: fw_update
    name: "Firmware"
    source: !secret ota_manifest_url
    update_interval: 6h
    on_update_available:
      - if:
          condition:
            switch.is_on: auto_update
          then:
            - logger.log: "New firmware, installing"
            - update.perform: fw_update

# ---------------------------------------------------------------- GPS (EC200U GNSS) -> Home Assistant + Traccar
ec200u_gnss:
  id: gnss
  update_interval: 5s

http_request:
  timeout: 10s
  verify_ssl: true

interval:
  - interval: 5s
    then:
      - if:
          condition:
            lambda: return id(gnss).has_fix() && id(mqtt_client).is_connected();
          then:
            - mqtt.publish:
                topic: ${name}/position
                payload: !lambda |-
                  const auto &f = id(gnss).get_fix();
                  char buf[160];
                  snprintf(buf, sizeof(buf),
                           "{\"latitude\":%.6f,\"longitude\":%.6f,\"gps_accuracy\":%.0f,\"altitude\":%.0f,"
                           "\"speed\":%.1f,\"course\":%.0f}",
                           f.latitude, f.longitude, f.hdop * 5.0f, f.altitude, f.speed, f.course);
                  return std::string(buf);
      - if:
          condition:
            lambda: |-
              if (!id(gnss).has_fix() || !id(lte).is_connected()) return false;
              const uint32_t every = id(engine_running).state ? id(set_traccar_interval_driving).state * 1000UL
                                                              : id(set_report_interval).state * 60000UL;
              if (id(traccar_last_ms) != 0 && millis() - id(traccar_last_ms) < every) return false;
              id(traccar_last_ms) = millis();
              return true;
          then:
            # OsmAnd protocol: speed in knots; extra parameters become Traccar attributes
            - http_request.get:
                url: !lambda |-
                  const auto &f = id(gnss).get_fix();
                  char buf[320];
                  snprintf(buf, sizeof(buf),
                           "%s/?id=%s&lat=%.6f&lon=%.6f&timestamp=%u&speed=%.1f&bearing=%.0f&altitude=%.0f"
                           "&hdop=%.1f&sat=%d&ignition=%s&power=%.2f",
                           "${traccar_url}", "${traccar_device_id}", f.latitude, f.longitude,
                           (unsigned) id(gnss).get_fix_epoch(), f.speed / 1.852f, f.course, f.altitude, f.hdop,
                           f.satellites, id(engine_running).state ? "true" : "false",
                           std::isnan(id(car_battery).state) ? 0.0f : id(car_battery).state);
                  return std::string(buf);
                on_response:
                  then:
                    - if:
                        condition:
                          lambda: return response->status_code == 200;
                        then:
                          - power_manager.report_done: pm

# ---------------------------------------------------------------- parking mode / deep sleep
# Settings are Home Assistant entities (Configuration). command_retain: the broker keeps a changed value until
# the dongle's next wake picks it up.
deep_sleep:
  id: deep_sleep_1

power_manager:
  id: pm
  deep_sleep_id: deep_sleep_1
  battery_adc: car_battery
  voltage_multiplier: 11.0
  modem_status: lte_status
  stay_awake: stay_awake
  engine_on_voltage: set_engine_on_voltage
  unplugged_voltage: set_unplugged_voltage
  low_battery_voltage: set_low_battery_voltage
  parking_delay: set_parking_delay
  check_interval: set_check_interval
  report_interval: set_report_interval
  low_battery_report_interval: set_low_battery_report_interval
  report_timeout: set_report_timeout
  cell_voltage: modem_supply        # backup cell voltage while unplugged (modem AT+CBC)
  cell_cutoff_voltage: set_cell_cutoff_voltage
  on_network:
    - script.execute: lte_power_on
  on_shutdown:
    - script.execute: lte_power_off

number:
  - platform: template
    id: set_engine_on_voltage
    name: "Engine running above"
    entity_category: config
    unit_of_measurement: V
    icon: mdi:car-battery
    min_value: 12.6
    max_value: 14.5
    step: 0.1
    initial_value: 13.2
    optimistic: true
    restore_value: true
    mode: box
    command_retain: true
  - platform: template
    id: set_low_battery_voltage
    name: "Car battery low below"
    entity_category: config
    unit_of_measurement: V
    icon: mdi:battery-alert
    min_value: 10.5
    max_value: 12.6
    step: 0.1
    initial_value: 12.0
    optimistic: true
    restore_value: true
    mode: box
    command_retain: true
  - platform: template
    id: set_unplugged_voltage
    name: "Unplugged below"
    entity_category: config
    unit_of_measurement: V
    icon: mdi:power-plug-off
    min_value: 3
    max_value: 9
    step: 0.5
    initial_value: 6
    optimistic: true
    restore_value: true
    mode: box
    command_retain: true
  - platform: template
    id: set_parking_delay
    name: "Sleep after engine off"
    entity_category: config
    unit_of_measurement: min
    icon: mdi:timer-sand
    min_value: 1
    max_value: 120
    step: 1
    initial_value: 5
    optimistic: true
    restore_value: true
    mode: box
    command_retain: true
  - platform: template
    id: set_check_interval
    name: "Parked battery check every"
    entity_category: config
    unit_of_measurement: s
    icon: mdi:timer-outline
    min_value: 30
    max_value: 3600
    step: 10
    initial_value: 60
    optimistic: true
    restore_value: true
    mode: box
    command_retain: true
  - platform: template
    id: set_report_interval
    name: "Parked position report every"
    entity_category: config
    unit_of_measurement: min
    icon: mdi:map-marker-radius
    min_value: 5
    max_value: 1440
    step: 5
    initial_value: 30
    optimistic: true
    restore_value: true
    mode: box
    command_retain: true
  - platform: template
    id: set_low_battery_report_interval
    name: "Report every (battery low)"
    entity_category: config
    unit_of_measurement: min
    icon: mdi:map-marker-radius-outline
    min_value: 15
    max_value: 1440
    step: 15
    initial_value: 120
    optimistic: true
    restore_value: true
    mode: box
    command_retain: true
  - platform: template
    id: set_report_timeout
    name: "Report timeout"
    entity_category: config
    unit_of_measurement: min
    icon: mdi:timer-alert-outline
    min_value: 1
    max_value: 15
    step: 1
    initial_value: 3
    optimistic: true
    restore_value: true
    mode: box
    command_retain: true
  - platform: template
    id: set_traccar_interval_driving
    name: "Traccar interval driving"
    entity_category: config
    unit_of_measurement: s
    icon: mdi:map-clock
    min_value: 5
    max_value: 300
    step: 5
    initial_value: 10
    optimistic: true
    restore_value: true
    mode: box
    command_retain: true
  - platform: template
    id: set_cell_cutoff_voltage
    name: "Backup cell cut-off"
    entity_category: config
    unit_of_measurement: V
    icon: mdi:battery-alert-variant-outline
    min_value: 3.3
    max_value: 3.9
    step: 0.05
    initial_value: 3.6
    optimistic: true
    restore_value: true
    mode: box
    command_retain: true

text_sensor:
  - platform: template
    name: "Power mode"
    icon: mdi:power-sleep
    entity_category: diagnostic
    update_interval: 5s
    lambda: |-
      if (id(pm).is_cell_low())
        return std::string(id(pm).get_mode_str()) + " (backup cell low)";
      return std::string(id(pm).get_mode_str());
  - platform: obd2
    obd2_id: obd
    vin:
      name: "VIN"
      entity_category: diagnostic
    fault_codes:
      name: "Fault codes"

button:
  - platform: obd2
    obd2_id: obd
    clear_fault_codes:
      name: "Clear fault codes"

# ---------------------------------------------------------------- V2X: ITS-G5 receive -> OpenTrafficMap
otm_uplink:
  id: otm
  node_id: !secret otm_node_id

globals:
  - id: last_packet_ms
    type: uint32_t
    initial_value: "0"
  - id: traccar_last_ms
    type: uint32_t
    initial_value: "0"

its_g5_receiver:
  id: g5
  channel: 5900               # G5CC
  broadcast_only: true
  on_packet:
    - lambda: |-
        id(last_packet_ms) = millis();
        id(otm).publish_packet(x);

# ---------------------------------------------------------------- OBD-II over CAN (ISO 15765-4, 11 bit, 500 kbit/s)
# components/obd2 (ESPHome's esp32_can does not link on the ESP32-C5). Only active while the engine runs.
obd2:
  id: obd
  tx_pin: GPIO4               # IO4 (pin 17) CAN_TX -> TCAN334
  rx_pin: GPIO5               # IO5 (pin 16) CAN_RX <- TCAN334
  standby_pin: GPIO10         # IO10 (pin 12) TCAN334 STB, high = standby
  bit_rate: 500000
  poll_interval: 250ms        # one request per 250 ms, round robin (speed/RPM twice per round)
  dtc_interval: 5min          # stored fault codes (mode 03): on engine start and every 5 min

# ---------------------------------------------------------------- sensors
sensor:
  - platform: adc             # IO1 (pin 7) VSENSE = VIN_PROT / 11 (R109 100k / R110 10k)
    id: car_battery
    name: "Car battery"
    pin: GPIO1
    attenuation: 12db
    update_interval: 2s
    device_class: voltage
    unit_of_measurement: V
    accuracy_decimals: 2
    filters:
      - multiply: 11.0
      - sliding_window_moving_average:
          window_size: 5
          send_every: 5
  - platform: obd2
    obd2_id: obd
    speed:
      name: "Speed"
    rpm:
      name: "Engine RPM"
    coolant_temperature:
      name: "Coolant temperature"
    engine_load:
      name: "Engine load"
    fuel_level:
      name: "Fuel level"
    intake_temperature:
      name: "Intake air temperature"
    ambient_temperature:
      name: "Ambient temperature"
    ecu_voltage:
      name: "ECU voltage"
    dtc_count:
      name: "Fault code count"
  - platform: modem
    rssi:
      name: "LTE signal"
  - platform: ec200u_gnss
    latitude:
      name: "Latitude"
    longitude:
      name: "Longitude"
    altitude:
      name: "Altitude"
    speed:
      name: "GPS speed"
    course:
      name: "Course"
    hdop:
      name: "GPS HDOP"
      entity_category: diagnostic
    satellites:
      name: "GPS satellites"
      entity_category: diagnostic
    supply_voltage:
      id: modem_supply
      name: "Supply voltage"
      entity_category: diagnostic
  - platform: its_g5_receiver
    its_g5_receiver_id: g5
    packets_received:
      name: "V2X packets received"
      icon: mdi:car-connected
      filters:
        - throttle: 60s
    packets_dropped:
      name: "V2X packets dropped"
      entity_category: diagnostic
      filters:
        - throttle: 60s
  - platform: uptime
    name: "Uptime"

# ---------------------------------------------------------------- status LED (D301 SK6812MINI-HS, IO27 / pin 18)
#   red = no LTE, yellow = LTE up but MQTT not connected, green = connected, blue flash = V2X frame received
light:
  - platform: esp32_rmt_led_strip
    id: status_led
    name: "Status LED"
    entity_category: config
    pin: GPIO27
    num_leds: 1
    chipset: SK6812
    channel_colors: GRB
    default_transition_length: 0s
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_on:
      - light.turn_on:
          id: status_led
          effect: "Status"
          brightness: 30%
    effects:
      - addressable_lambda:
          name: "Status"
          update_interval: 50ms
          lambda: |-
            if (millis() - id(last_packet_ms) < 60) {
              it[0] = Color(0, 0, 255);
            } else if (!id(lte).is_connected()) {
              it[0] = Color(255, 0, 0);
            } else if (!id(mqtt_client).is_connected()) {
              it[0] = Color(255, 160, 0);
            } else {
              it[0] = Color(0, 255, 0);
            }
